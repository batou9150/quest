name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Start Firestore emulator
        run: |
          docker run -d -p 8681:8681 gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud emulators firestore start --host-port=0.0.0.0:8681
          timeout 120 bash -c 'until curl -s localhost:8681 >/dev/null; do sleep 2; done'
      - run: npm test
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8681
      - run: npm run levels:push -- packages/levels-demo/level.json --dry-run
      - run: npm run build
      - run: docker build -t quest:ci .
