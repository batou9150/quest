[project]
name = "quest-agent"
version = "0.1.0"
description = "A minimal Google ADK agent that plays The Quantum Quest through its OpenAPI spec."
requires-python = ">=3.11"
dependencies = ["google-adk>=2.0", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "respx>=0.21", "anyio>=4"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["quest_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
